<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recipe Guide</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7ed 0%,
                    #fff 45%,
                    #fef2f2 100%
                );

            color: #292524;
            min-height: 100vh;
        }


        /* -----------------------------
           HEADER
        ----------------------------- */

        .hero {
            padding: 60px 20px 45px;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 30px;

            background: #ffffff;
            border: 1px solid #fed7aa;

            color: #c2410c;
            font-size: 13px;
            font-weight: 700;

            margin-bottom: 18px;
        }

        .hero h1 {
            margin: 0;

            font-size: clamp(
                36px,
                7vw,
                64px
            );

            line-height: 1.05;

            letter-spacing: -2px;
        }

        .hero h1 span {
            color: #ea580c;
        }

        .hero p {
            max-width: 650px;
            margin: 18px auto 0;

            color: #78716c;
            font-size: 17px;
            line-height: 1.6;
        }


        /* -----------------------------
           MAIN CONTAINER
        ----------------------------- */

        .container {
            width: min(
                1100px,
                calc(100% - 30px)
            );

            margin: auto;
            padding-bottom: 60px;
        }


        /* -----------------------------
           SEARCH
        ----------------------------- */

        .search-card {
            background: rgba(
                255,
                255,
                255,
                0.9
            );

            backdrop-filter: blur(10px);

            padding: 12px;

            border-radius: 20px;

            border: 1px solid #fed7aa;

            box-shadow:
                0 15px 40px
                rgba(120, 53, 15, 0.08);

            display: flex;
            gap: 10px;

            max-width: 800px;
            margin: 0 auto 35px;
        }

        .search-card input {
            flex: 1;

            border: none;
            outline: none;

            padding: 16px 18px;

            font-size: 16px;

            background: transparent;
            color: #292524;
        }

        .search-card input::placeholder {
            color: #a8a29e;
        }

        .search-card button {
            border: none;
            border-radius: 14px;

            padding: 0 25px;

            background: #ea580c;
            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;
        }

        .search-card button:hover {
            background: #c2410c;
            transform: translateY(-2px);
        }


        /* -----------------------------
           CARDS
        ----------------------------- */

        .card {
            background: white;

            border: 1px solid #f1f5f9;

            border-radius: 20px;

            padding: 28px;

            margin-bottom: 22px;

            box-shadow:
                0 10px 30px
                rgba(28, 25, 23, 0.06);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 18px;

            font-size: 22px;
        }

        .card h3 {
            margin-top: 25px;
            margin-bottom: 12px;

            font-size: 17px;
        }


        /* -----------------------------
           RECIPE HEADER
        ----------------------------- */

        .recipe-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        .recipe-title {
            margin: 0;
            font-size: 32px;
        }

        .recipe-subtitle {
            color: #78716c;
            margin-top: 7px;
        }


        /* -----------------------------
           SCORE
        ----------------------------- */

        .score-box {
            min-width: 150px;

            text-align: center;

            padding: 18px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #fff7ed,
                    #ffedd5
                );

            border: 1px solid #fed7aa;
        }

        .score-number {
            font-size: 32px;
            font-weight: 800;
            color: #ea580c;
        }

        .score-label {
            color: #78716c;
            font-size: 13px;
            margin-top: 3px;
        }


        /* -----------------------------
           GRID
        ----------------------------- */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;
        }


        /* -----------------------------
           INGREDIENTS
        ----------------------------- */

        .ingredient-list {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;

            padding: 0;
            list-style: none;
        }

        .ingredient-list li {
            padding: 12px 14px;

            background: #fff7ed;

            border: 1px solid #ffedd5;

            border-radius: 12px;

            line-height: 1.4;
        }


        /* -----------------------------
           COOKING STEPS
        ----------------------------- */

        .steps {
            padding: 0;
            list-style: none;

            counter-reset: recipe-step;
        }

        .steps li {
            counter-increment: recipe-step;

            position: relative;

            padding:
                0 0 20px 52px;

            margin-bottom: 20px;

            border-bottom:
                1px solid #f5f5f4;

            line-height: 1.6;
        }

        .steps li:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .steps li::before {
            content:
                counter(recipe-step);

            position: absolute;

            left: 0;
            top: 0;

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #ea580c;
            color: white;

            font-weight: 700;
            font-size: 14px;
        }


        /* -----------------------------
           INFO BOXES
        ----------------------------- */

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 15px;
        }

        .info-box {
            padding: 20px;

            border-radius: 16px;

            background: #fafaf9;

            border: 1px solid #e7e5e4;
        }

        .info-box h3 {
            margin-top: 0;

            font-size: 16px;
        }

        .info-box ul {
            padding-left: 20px;
        }


        /* -----------------------------
           BEST METHOD
        ----------------------------- */

        .best-method {
            background:
                linear-gradient(
                    135deg,
                    #fff7ed,
                    #ffffff
                );

            border:
                1px solid #fdba74;
        }

        .selected-source {
            display: inline-block;

            padding: 8px 13px;

            background: #ffedd5;

            color: #c2410c;

            border-radius: 20px;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 15px;
        }

        .method-score {
            font-size: 24px;
            font-weight: 800;

            color: #ea580c;

            margin: 10px 0;
        }


        /* -----------------------------
           SOURCE COMPARISON
        ----------------------------- */

        .comparison-stat {
            display: flex;

            gap: 15px;

            margin-bottom: 20px;
        }

        .stat {
            flex: 1;

            padding: 17px;

            background: #fafaf9;

            border-radius: 14px;

            border: 1px solid #e7e5e4;

            text-align: center;
        }

        .stat strong {
            display: block;

            font-size: 25px;

            color: #ea580c;
        }

        .stat span {
            color: #78716c;

            font-size: 13px;
        }


        /* -----------------------------
           SOURCE CARDS
        ----------------------------- */

        .source {
            padding: 15px;

            margin: 10px 0;

            background: #fafaf9;

            border-radius: 13px;

            border: 1px solid #e7e5e4;

            line-height: 1.5;
        }


        /* -----------------------------
           SUCCESS / WARNING / ERROR
        ----------------------------- */

        .success {
            background: #f0fdf4;

            border:
                1px solid #bbf7d0;

            color: #166534;

            padding: 15px;

            border-radius: 13px;

            margin-bottom: 15px;
        }

        .warning {
            background: #fffbeb;

            border:
                1px solid #fde68a;

            color: #92400e;

            padding: 14px;

            border-radius: 13px;

            margin-bottom: 9px;

            line-height: 1.5;
        }

        .error {
            background: #fef2f2;

            border:
                1px solid #fecaca;

            color: #991b1b;

            padding: 18px;

            border-radius: 15px;

            text-align: center;
        }


        /* -----------------------------
           FOOTER
        ----------------------------- */

        .footer {
            text-align: center;

            color: #a8a29e;

            font-size: 13px;

            padding: 15px 0 5px;
        }


        /* -----------------------------
           MOBILE
        ----------------------------- */

        @media (max-width: 750px) {

            .hero {
                padding-top: 40px;
            }

            .hero h1 {
                letter-spacing: -1px;
            }

            .search-card {
                flex-direction: column;
            }

            .search-card button {
                padding: 14px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .ingredient-list {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .recipe-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .score-box {
                width: 100%;
            }

            .comparison-stat {
                flex-direction: column;
            }

            .card {
                padding: 21px;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HERO
========================================== -->

<header class="hero">

    <div class="hero-badge">
        ✨ Source-Grounded Recipe Intelligence
    </div>

    <h1>
        🍰 Recipe <span>Guide</span>
    </h1>

    <p>
        Discover complete recipes and understand
        how ingredients, cooking methods, source
        evidence, taste, and fragrance influence
        the final recommendation.
    </p>

</header>


<div class="container">


    <!-- ==========================================
         SEARCH
    =========================================== -->

    <div class="search-card">

        <input
            type="text"
            id="sweetInput"
            placeholder="Search a sweet — Gulab Jamun, Rasgulla..."
        >

        <button onclick="searchRecipe()">
            🔍 Search
        </button>

    </div>


    <div id="result"></div>


    <div class="footer">
        Recipe Guide • Evidence-based recipe reasoning
    </div>


</div>


<script>


// ==========================================
// SEARCH RECIPE
// ==========================================

async function searchRecipe() {

    const input =
        document.getElementById(
            "sweetInput"
        );

    const result =
        document.getElementById(
            "result"
        );


    const sweetName =
        input.value.trim();


    if (!sweetName) {

        result.innerHTML = `
            <div class="error">
                Please enter a sweet name to search.
            </div>
        `;

        return;
    }


    result.innerHTML = `
        <div class="card">

            <h2>
                🔄 Finding the best recipe...
            </h2>

            <p>
                Comparing available evidence and
                preparing the recommendation.
            </p>

        </div>
    `;


    try {

        const response = await fetch(
            "/recipe/" +
            encodeURIComponent(
                sweetName
            )
        );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.recipe
        ) {

            result.innerHTML = `
                <div class="error">

                    <strong>
                        ${data.message ||
                        "Recipe not found"}
                    </strong>

                    <p>
                        Try one of the available
                        sweets such as Gulab Jamun,
                        Rasgulla, Jalebi, or
                        Kaju Katli.
                    </p>

                </div>
            `;

            return;
        }


        const recipe =
            data.recipe || {};


        const comparison =
            data.source_comparison || {};


        const taste =
            recipe.taste_and_fragrance || {};


        const bestMethod =
            data.best_method_selection || {};


        let html = "";


        // ==========================================
        // RECIPE HEADER
        // ==========================================

        html += `

            <div class="card">

                <div class="recipe-header">

                    <div>

                        <h2 class="recipe-title">
                            🍮 ${data.sweet}
                        </h2>

                        <p class="recipe-subtitle">
                            Complete recipe and
                            evidence-based recommendation
                        </p>

                    </div>


                    <div class="score-box">

                        <div class="score-number">
                            ${data.decision_score}/100
                        </div>

                        <div class="score-label">
                            Recommendation Score
                        </div>

                    </div>

                </div>

            </div>

        `;


        // ==========================================
        // INGREDIENTS + METHOD
        // ==========================================

        html += `

            <div class="grid">

                <div class="card">

                    <h2>
                        🧂 Ingredients
                    </h2>

                    <ul class="ingredient-list">
        `;


        (recipe.ingredients || [])
            .forEach(function(item) {

                html += `
                    <li>
                        ${item}
                    </li>
                `;

            });


        html += `

                    </ul>

                </div>


                <div class="card">

                    <h2>
                        👩‍🍳 Cooking Method
                    </h2>

                    <ol class="steps">
        `;


        (recipe.steps || [])
            .forEach(function(step) {

                html += `
                    <li>
                        ${step}
                    </li>
                `;

            });


        html += `

                    </ol>

                </div>

            </div>

        `;


        // ==========================================
        // BEST METHOD
        // ==========================================

        html += `

            <div class="card best-method">

                <h2>
                    🏆 Best Method Selected
                </h2>
        `;


        if (
            bestMethod.selected_source
        ) {

            html += `

                <div class="selected-source">

                    Selected from:
                    ${bestMethod.selected_source}

                </div>

            `;

        }


        html += `

                <div class="method-score">

                    ${bestMethod.selection_score || 0}/100

                </div>

                <p>
                    <strong>
                        Method selection score
                    </strong>
                </p>

        `;


        if (bestMethod.reason) {

            html += `

                <div class="success">

                    <strong>
                        Why this method?
                    </strong>

                    <br><br>

                    ${bestMethod.reason}

                </div>

            `;

        }


        if (
            bestMethod.selected_method &&
            bestMethod.selected_method.length
        ) {

            html += `

                <h3>
                    Selected Method Evidence
                </h3>

                <ol class="steps">

            `;


            bestMethod.selected_method
                .forEach(function(step) {

                    html += `
                        <li>
                            ${step}
                        </li>
                    `;

                });


            html += `
                </ol>
            `;

        }


        if (
            bestMethod.source_scores &&
            bestMethod.source_scores.length
        ) {

            html += `

                <h3>
                    Source Method Scores
                </h3>

            `;


            bestMethod.source_scores
                .forEach(function(source) {

                    html += `

                        <div class="source">

                            <strong>
                                ${source.source}
                            </strong>

                            <br>

                            Method evidence score:
                            <strong>
                                ${source.score}/100
                            </strong>

                        </div>

                    `;

                });

        }


        html += `
            </div>
        `;


        // ==========================================
        // DECISION REASONS
        // ==========================================

        html += `

            <div class="card">

                <h2>
                    🧠 Why This Recipe Was Selected
                </h2>

                <ul>
        `;


        (data.decision_reasons || [])
            .forEach(function(reason) {

                html += `
                    <li>
                        ${reason}
                    </li>
                `;

            });


        html += `

                </ul>

            </div>

        `;


        // ==========================================
        // TASTE / FRAGRANCE / COOKING EFFECTS
        // ==========================================

        html += `

            <div class="card">

                <h2>
                    👅 Taste & Fragrance Analysis
                </h2>

                <div class="info-grid">


                    <div class="info-box">

                        <h3>
                            👅 Taste
                        </h3>

                        <ul>
        `;


        (taste.taste || [])
            .forEach(function(item) {

                html += `
                    <li>
                        ${item}
                    </li>
                `;

            });


        html += `

                        </ul>

                    </div>


                    <div class="info-box">

                        <h3>
                            🌸 Fragrance
                        </h3>

                        <ul>
        `;


        (taste.fragrance || [])
            .forEach(function(item) {

                html += `
                    <li>
                        ${item}
                    </li>
                `;

            });


        html += `

                        </ul>

                    </div>


                    <div class="info-box">

                        <h3>
                            🔥 Cooking Effects
                        </h3>

                        <ul>
        `;


        (taste.cooking_effects || [])
            .forEach(function(item) {

                html += `
                    <li>
                        ${item}
                    </li>
                `;

            });


        html += `

                        </ul>

                    </div>

                </div>

            </div>

        `;


        // ==========================================
        // SOURCE COMPARISON
        // ==========================================

        html += `

            <div class="card">

                <h2>
                    🔎 Source Comparison
                </h2>


                <div class="comparison-stat">

                    <div class="stat">

                        <strong>
                            ${comparison.source_count || 0}
                        </strong>

                        <span>
                            Sources Analyzed
                        </span>

                    </div>


                    <div class="stat">

                        <strong>
                            ${comparison.agreement_score || 0}/40
                        </strong>

                        <span>
                            Agreement Score
                        </span>

                    </div>

                </div>


                <h3>
                    ✅ What Sources Agree On
                </h3>

                <ul>
        `;


        const agreement =
            comparison.agreement || [];


        if (agreement.length) {

            agreement.forEach(function(item) {

                html += `
                    <li>
                        ${item}
                    </li>
                `;

            });

        } else {

            html += `
                <li>
                    No strong cross-source agreement
                    was identified.
                </li>
            `;

        }


        html += `

                </ul>


                <h3>
                    ⚖️ Differences Between Sources
                </h3>

        `;


        const differences =
            comparison.differences || [];


        if (differences.length) {

            differences.forEach(
                function(source) {

                    html += `

                        <div class="source">

                            <strong>
                                ${source.source ||
                                "Source"}
                            </strong>

                    `;


                    const ingredients =
                        source.unique_ingredients ||
                        [];


                    if (ingredients.length) {

                        html += `

                            <p>
                                <strong>
                                    Additional ingredients:
                                </strong>
                            </p>

                            <ul>

                        `;


                        ingredients.forEach(
                            function(item) {

                                html += `
                                    <li>
                                        ${item}
                                    </li>
                                `;

                            }
                        );


                        html += `
                            </ul>
                        `;

                    }


                    const methods =
                        source.unique_method_points ||
                        source.unique_methods ||
                        [];


                    if (methods.length) {

                        html += `

                            <p>
                                <strong>
                                    Additional method points:
                                </strong>
                            </p>

                            <ul>

                        `;


                        methods.forEach(
                            function(item) {

                                html += `
                                    <li>
                                        ${item}
                                    </li>
                                `;

                            }
                        );


                        html += `
                            </ul>
                        `;

                    }


                    html += `
                        </div>
                    `;

                }
            );

        } else {

            html += `

                <p>
                    No major differences were identified.
                </p>

            `;

        }


        // Selection reasoning

        html += `

                <h3>
                    🧠 Selection Reasoning
                </h3>

                <ul>

        `;


        const selectionReasons =
            comparison.selection_reasons || [];


        if (selectionReasons.length) {

            selectionReasons.forEach(
                function(reason) {

                    html += `
                        <li>
                            ${reason}
                        </li>
                    `;

                }
            );

        } else {

            html += `
                <li>
                    The method was selected using
                    the available source evidence.
                </li>
            `;

        }


        html += `

                </ul>

            </div>

        `;


        // ==========================================
        // SOURCES
        // ==========================================

        html += `

            <div class="card">

                <h2>
                    📚 Sources Used
                </h2>

        `;


        (recipe.sources || [])
            .forEach(function(source) {

                html += `

                    <div class="source">
                        ${source}
                    </div>

                `;

            });


        html += `
            </div>
        `;


        // ==========================================
        // GUARDRAILS
        // ==========================================

        html += `

            <div class="card">

                <h2>
                    🛡️ Guardrails
                </h2>

        `;


        const warnings =
            data.guardrail_warnings || [];


        if (warnings.length) {

            warnings.forEach(
                function(warning) {

                    html += `

                        <div class="warning">

                            ⚠️ ${warning}

                        </div>

                    `;

                }
            );

        } else {

            html += `

                <div class="success">

                    ✅ No guardrail warnings detected.

                </div>

            `;

        }


        html += `
            </div>
        `;


        // ==========================================
        // DISPLAY
        // ==========================================

        result.innerHTML = html;


        // Scroll smoothly to result

        result.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    catch (error) {

        console.error(error);

        result.innerHTML = `

            <div class="error">

                <strong>
                    Something went wrong.
                </strong>

                <p>
                    Please make sure the server is
                    running and try again.
                </p>

            </div>

        `;

    }

}


// ==========================================
// ENTER KEY SUPPORT
// ==========================================

document
    .getElementById("sweetInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchRecipe();

            }

        }
    );

</script>


</body>

</html>
